# Chroma + BM25 index: reuse the RAG/8.2026-data newspaper stack.
#   rag-newspapers-chroma  → localhost:8001  (collection newspapers_2026)
#   rag-newspapers-lexical → localhost:8002
# Do not start another Chroma here — that stack already owns the 2026 archive.

services:
  mongo:
    image: mongo:7
    container_name: hindubot-mongo
    ports:
      - "27017:27017"
    volumes:
      - hindubot_mongo_data:/data/db
    restart: unless-stopped

volumes:
  hindubot_mongo_data:
