apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lexical-data
  labels:
    app: lexical
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lexical
  labels:
    app: lexical
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lexical
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: lexical
    spec:
      containers:
        - name: lexical
          image: asia-south1-docker.pkg.dev/project-b23f08c8-479d-4cce-994/rag/rag-lexical:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATA_DIR
              value: /data
            - name: PORT
              value: "8080"
            - name: MAX_BYTES
              value: "2147483648"
          volumeMounts:
            - name: lexical-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
      volumes:
        - name: lexical-data
          persistentVolumeClaim:
            claimName: lexical-data
---
apiVersion: v1
kind: Service
metadata:
  name: lexical
  labels:
    app: lexical
spec:
  type: ClusterIP
  selector:
    app: lexical
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
