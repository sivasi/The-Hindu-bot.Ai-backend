apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  labels:
    app: rag-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-api
  template:
    metadata:
      labels:
        app: rag-api
    spec:
      serviceAccountName: rag-api
      containers:
        - name: rag-api
          # Build & push, then replace PROJECT_ID / REGION / REPO as needed:
          #   asia-south1-docker.pkg.dev/PROJECT_ID/rag/rag-api:latest
          image: asia-south1-docker.pkg.dev/project-b23f08c8-479d-4cce-994/rag/rag-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: rag-api-config
            - secretRef:
                name: rag-api-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /api/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
  labels:
    app: rag-api
spec:
  type: NodePort
  selector:
    app: rag-api
  ports:
    - name: http
      port: 3001
      targetPort: http
      nodePort: 30001
      protocol: TCP
