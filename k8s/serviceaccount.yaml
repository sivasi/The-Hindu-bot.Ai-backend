# Kubernetes ServiceAccount for the API.
# Bind it to a GCP SA via Workload Identity (recommended on GKE).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-api
  labels:
    app: rag-api
  annotations:
    # Replace PROJECT_ID with your GCP project id
    iam.gke.io/gcp-service-account: rag-api@project-b23f08c8-479d-4cce-994.iam.gserviceaccount.com
